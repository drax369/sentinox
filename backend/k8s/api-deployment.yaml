apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinox-api
  namespace: sentinox
  labels:
    app: sentinox-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sentinox-api
  template:
    metadata:
      labels:
        app: sentinox-api
    spec:
      containers:
        - name: api
          image: sentinox/api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: sentinox-secrets
            - configMapRef:
                name: sentinox-config
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sentinox-api
  namespace: sentinox
spec:
  selector:
    app: sentinox-api
  ports:
    - port: 80
      targetPort: 4000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sentinox-api-hpa
  namespace: sentinox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sentinox-api
  minReplicas: 3
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
